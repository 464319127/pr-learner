[project]
name = "pr-learner"
version = "0.1.0"
description = "用 agent 阅读 GitHub PR，并分类记录阅读到的知识"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "pydantic>=2.10",
    "python-frontmatter>=1.1",
    "httpx>=0.28",
    # convert 命令把历史 .md 正文转成 HTML 用。它本来已通过 typer→rich 在依赖树里，
    # 但依赖一个传递依赖是脆的，显式声明。
    "markdown-it-py>=3",
]

[project.scripts]
pr-learner = "pr_learner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_learner"]
# 确保前端静态资源与提示词模板随包一起分发。
# static 必须用 `**/*`：写成 `static/*` 只匹配直接子项，vendor/ 子目录不会进 wheel，
# 本地 editable 安装与测试照旧全绿，只在 wheel / Docker 构建后炸。
artifacts = ["src/pr_learner/static/**/*", "src/pr_learner/prompt_templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
