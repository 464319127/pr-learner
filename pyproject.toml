[project]
name = "pr-learner"
version = "0.1.0"
description = "用 agent 阅读 GitHub PR，并分类记录阅读到的知识"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "pydantic>=2.10",
    "python-frontmatter>=1.1",
    "httpx>=0.28",
]

[project.scripts]
pr-learner = "pr_learner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_learner"]
# 确保前端静态资源与提示词模板随包一起分发
artifacts = ["src/pr_learner/static/*", "src/pr_learner/prompt_templates/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
