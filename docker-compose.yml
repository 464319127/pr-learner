services:
  knowledge-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # 知识库挂进容器，读写皆可（Web 端记录知识需要写权限）；本地即时可见
      - ./knowledge:/data/knowledge
      # 复用宿主机的 gh 配置（git_protocol/user 等）。只读挂载。
      # 注意：macOS 上 gh 的 token 存在系统钥匙串而非此目录，故 token 需另经
      # GH_TOKEN 环境变量注入（见下）。
      - ${HOME}/.config/gh:/root/.config/gh:ro
    environment:
      PR_LEARNER_KNOWLEDGE_DIR: /data/knowledge
      # 从 .env 读取 GitHub token（compose 自动加载同目录 .env）。gh 优先读
      # GH_TOKEN，容器内即有登录态。macOS 上 token 存系统钥匙串、不在挂载的
      # 配置目录里，故必须走此变量注入。.env 已被 .gitignore 忽略，不进 git。
      # 首次使用：cp .env.example .env 后填入 `gh auth token` 的输出。
      GH_TOKEN: ${GH_TOKEN:-}
    restart: unless-stopped
